<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinder — Semantic runtime for websites you control</title>
    <meta
      name="description"
      content="Cinder resolves real commands (navigation, filters, actions) entirely in the browser, for free, before ever reaching an AI model. npm install usecinder."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Cinder — Semantic runtime for websites you control" />
    <meta
      property="og:description"
      content="Tag your app with plain HTML attributes. Cinder resolves commands locally, for free, and falls back to AI (Cinder Relay) only when genuinely needed."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://usecinder.dev/" />
    <meta property="og:site_name" content="Cinder" />
    <meta property="og:image" content="https://usecinder.dev/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cinder — Semantic runtime for websites you control" />
    <meta
      name="twitter:description"
      content="Tag your app with plain HTML attributes. Cinder resolves commands locally, for free, and falls back to AI (Cinder Relay) only when genuinely needed."
    />
    <meta name="twitter:image" content="https://usecinder.dev/og-image.svg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Cinder",
        "alternateName": "usecinder",
        "url": "https://usecinder.dev",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any (browser-based)",
        "description": "Cinder is a semantic runtime for websites you control. Tag real routes, actions, fields, and outputs with plain HTML attributes, and Cinder resolves text or voice commands against that structure entirely in the browser, before ever reaching an AI model.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "softwareHelp": "https://usecinder.dev/docs",
        "codeRepository": "https://github.com/harry-sandhu/usecinder",
        "license": "https://github.com/harry-sandhu/usecinder/blob/main/LICENSE",
        "author": {
          "@type": "Person",
          "name": "harry-sandhu"
        }
      }
    </script>
    <meta name="theme-color" content="#2563eb" />
    <link rel="canonical" href="https://usecinder.dev/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      (() => {
        const key = 'cinder-theme';
        const stored = localStorage.getItem(key);
        const theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
